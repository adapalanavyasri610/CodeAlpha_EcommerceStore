<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Orders - ShopEasy</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        /* =========================
           MY ORDERS PAGE
        ========================= */

        .orders-page {
            min-height: 70vh;

            padding: 70px 20px;

            max-width: 1000px;

            margin: auto;
        }


        .orders-page h2 {
            text-align: center;

            margin-bottom: 35px;

            font-size: 38px;
        }


        .orders-container {
            display: flex;

            flex-direction: column;

            gap: 20px;
        }


        .order-card {
            background: white;

            padding: 25px;

            border-radius: 12px;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.10);
        }


        .order-card h3 {
            margin-bottom: 15px;
        }


        .order-card p {
            margin: 8px 0;
        }


        .order-status {
            font-weight: bold;

            color: #28a745;
        }


        .empty-orders {
            text-align: center;

            padding: 40px;

            background: white;

            border-radius: 12px;
        }


        .login-message {
            text-align: center;

            padding: 40px;
        }


        .login-message a {
            display: inline-block;

            margin-top: 15px;

            padding: 12px 20px;

            background: #007bff;

            color: white;

            text-decoration: none;

            border-radius: 8px;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 650px) {

            .orders-page {
                padding: 50px 15px;
            }

            .orders-page h2 {
                font-size: 32px;
            }

        }
    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================= -->

    <header class="header">

        <div class="container navbar">

            <div class="logo">
                ShopEasy
            </div>


            <nav class="nav-links">

                <a href="index.html">
                    Home
                </a>

                <a href="index.html#products">
                    Products
                </a>

                <a href="my-orders.html">
                    My Orders
                </a>

                <a href="cart.html">
                    Cart
                </a>

            </nav>


            <a href="cart.html" class="cart-icon">

                🛒

                <span id="cart-count">
                    0
                </span>

            </a>

        </div>

    </header>



    <!-- =========================
         MAIN
    ========================= -->

    <main class="orders-page">

        <h2>
            My Orders
        </h2>


        <div id="orders-container" class="orders-container">

            <p>
                Loading orders...
            </p>

        </div>

    </main>



    <!-- =========================
         FOOTER
    ========================= -->

    <footer class="footer">

        <div class="container">

            <h3>
                ShopEasy
            </h3>

            <p>
                Your simple online shopping destination.
            </p>

            <p class="copyright">
                © 2026 ShopEasy. All rights reserved.
            </p>

        </div>

    </footer>



    <!-- =========================
         MY ORDERS JAVASCRIPT
    ========================= -->

    <script src="js/my-orders.js"></script>


</body>

</html>
