<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout - ShopEasy</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        /* =========================
           CHECKOUT PAGE
        ========================= */

        .checkout-section {

            padding: 70px 0;

            min-height: 75vh;

        }


        .checkout-title {

            text-align: center;

            margin-bottom: 45px;

        }


        .checkout-title h1 {

            font-size: 40px;

            margin-bottom: 10px;

        }


        .checkout-title p {

            color: #666;

        }


        .checkout-layout {

            display: grid;

            grid-template-columns:
                2fr 1fr;

            gap: 30px;

            align-items: start;

        }


        .checkout-products {

            background: #ffffff;

            border: 1px solid #eeeeee;

            border-radius: 10px;

            padding: 30px;

        }


        .checkout-products h2 {

            margin-bottom: 25px;

        }


        .checkout-item {

            display: flex;

            align-items: center;

            gap: 20px;

            padding: 20px 0;

            border-bottom:
                1px solid #eeeeee;

        }


        .checkout-item:last-child {

            border-bottom: none;

        }


        .checkout-item-image {

            width: 80px;

            height: 80px;

            object-fit: cover;

            border-radius: 8px;

        }


        .checkout-item-info {

            flex: 1;

        }


        .checkout-item-info h3 {

            margin-bottom: 8px;

        }


        .checkout-item-info p {

            color: #666;

            margin: 4px 0;

        }


        .checkout-item-total {

            font-weight: 700;

        }


        .checkout-summary {

            background: #ffffff;

            border: 1px solid #eeeeee;

            border-radius: 10px;

            padding: 30px;

            position: sticky;

            top: 100px;

        }


        .checkout-summary h2 {

            margin-bottom: 25px;

        }


        .summary-row {

            display: flex;

            justify-content: space-between;

            margin-bottom: 15px;

            color: #555;

        }


        .summary-total {

            display: flex;

            justify-content: space-between;

            border-top:
                1px solid #eeeeee;

            padding-top: 20px;

            margin-top: 20px;

            font-size: 20px;

            font-weight: 700;

        }


        .place-order-button {

            width: 100%;

            border: none;

            background: #111;

            color: white;

            padding: 15px;

            border-radius: 5px;

            margin-top: 25px;

            cursor: pointer;

            font-size: 16px;

            font-weight: 600;

        }


        .place-order-button:hover {

            opacity: 0.85;

        }


        .place-order-button:disabled {

            opacity: 0.6;

            cursor: not-allowed;

        }


        .checkout-message {

            margin-top: 15px;

            text-align: center;

            color: #c0392b;

        }


        @media (max-width: 850px) {

            .checkout-layout {

                grid-template-columns: 1fr;

            }


            .checkout-summary {

                position: static;

            }

        }


        @media (max-width: 600px) {

            .checkout-item {

                align-items: flex-start;

            }


            .checkout-item-image {

                width: 65px;

                height: 65px;

            }

        }
    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================= -->

    <header class="header">

        <div class="container navbar">

            <div class="logo">
                ShopEasy
            </div>


            <nav class="nav-links">

                <a href="index.html">
                    Home
                </a>

                <a href="index.html#products">
                    Products
                </a>

                <a href="my-orders.html">
                    My Orders
                </a>

                <a href="cart.html">
                    Cart
                </a>

            </nav>

            <div class="cart-icon">

                🛒

                <span id="cart-count">
                    0
                </span>

            </div>

        </div>

    </header>



    <!-- =========================
         CHECKOUT SECTION
    ========================= -->

    <main class="checkout-section">

        <div class="container">


            <div class="checkout-title">

                <h1>
                    Checkout
                </h1>

                <p>
                    Review your order before placing it.
                </p>

            </div>



            <div id="checkout-content" class="checkout-layout">


                <!-- PRODUCTS -->

                <div class="checkout-products">

                    <h2>
                        Your Order
                    </h2>


                    <div id="checkout-items">

                        Loading cart...

                    </div>

                </div>



                <!-- SUMMARY -->

                <div class="checkout-summary">

                    <h2>
                        Order Summary
                    </h2>


                    <div class="summary-row">

                        <span>
                            Subtotal
                        </span>

                        <span id="checkout-subtotal">
                            ₹0.00
                        </span>

                    </div>


                    <div class="summary-row">

                        <span>
                            Shipping
                        </span>

                        <span id="checkout-shipping">
                            ₹0.00
                        </span>

                    </div>


                    <div class="summary-total">

                        <span>
                            Total
                        </span>

                        <span id="checkout-total">
                            ₹0.00
                        </span>

                    </div>


                    <button id="place-order-button" class="place-order-button">
                        Place Order
                    </button>


                    <p id="checkout-message" class="checkout-message"></p>

                </div>


            </div>

        </div>

    </main>



    <!-- =========================
         FOOTER
    ========================= -->

    <footer class="footer">

        <div class="container">

            <h3>
                ShopEasy
            </h3>

            <p>
                Your simple online shopping destination.
            </p>

            <p class="copyright">
                © 2026 ShopEasy. All rights reserved.
            </p>

        </div>

    </footer>



    <!-- CHECKOUT JAVASCRIPT -->

    <script src="js/checkout.js"></script>

</body>

</html>
