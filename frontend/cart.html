<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart - ShopEasy</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        /* =========================
           CART PAGE
        ========================= */

        .cart-section {
            padding: 70px 0;

            min-height: 75vh;
        }


        .cart-title {
            text-align: center;

            margin-bottom: 45px;
        }


        .cart-title h1 {
            font-size: 40px;

            margin-bottom: 10px;
        }


        .cart-title p {
            color: #666;
        }


        /* =========================
           CART LAYOUT
        ========================= */

        .cart-layout {

            display: grid;

            grid-template-columns:
                2fr 1fr;

            gap: 30px;

            align-items: start;
        }


        /* =========================
           CART ITEMS
        ========================= */

        .cart-items {

            background: #ffffff;

            border: 1px solid #eeeeee;

            border-radius: 10px;

            padding: 25px;
        }


        .cart-item {

            display: grid;

            grid-template-columns:
                100px 1fr auto;

            gap: 20px;

            align-items: center;

            padding: 20px 0;

            border-bottom:
                1px solid #eeeeee;
        }


        .cart-item:last-child {
            border-bottom: none;
        }


        .cart-item-image {

            width: 100px;

            height: 100px;

            object-fit: cover;

            border-radius: 8px;

            background: #f3f3f3;
        }


        .cart-item-info h3 {

            font-size: 18px;

            margin-bottom: 6px;
        }


        .cart-item-category {

            font-size: 12px;

            text-transform: uppercase;

            letter-spacing: 1px;

            color: #777;

            margin-bottom: 8px;
        }


        .cart-item-price {

            font-weight: 700;

            margin-bottom: 12px;
        }


        /* =========================
           QUANTITY
        ========================= */

        .quantity-controls {

            display: flex;

            align-items: center;

            gap: 10px;
        }


        .quantity-button {

            width: 30px;

            height: 30px;

            border: 1px solid #ddd;

            background: white;

            border-radius: 4px;

            cursor: pointer;

            font-size: 18px;
        }


        .quantity-button:hover {

            background: #111;

            color: white;
        }


        .quantity-value {

            min-width: 25px;

            text-align: center;

            font-weight: 600;
        }


        /* =========================
           REMOVE BUTTON
        ========================= */

        .remove-button {

            margin-top: 10px;

            border: none;

            background: none;

            color: #c0392b;

            cursor: pointer;

            padding: 0;

            font-size: 13px;
        }


        .remove-button:hover {

            text-decoration: underline;
        }


        /* =========================
           ITEM TOTAL
        ========================= */

        .cart-item-total {

            font-size: 18px;

            font-weight: 700;

            white-space: nowrap;
        }


        /* =========================
           CART SUMMARY
        ========================= */

        .cart-summary {

            background: #ffffff;

            border: 1px solid #eeeeee;

            border-radius: 10px;

            padding: 30px;

            position: sticky;

            top: 100px;
        }


        .cart-summary h2 {

            font-size: 24px;

            margin-bottom: 25px;
        }


        .summary-row {

            display: flex;

            justify-content: space-between;

            margin-bottom: 15px;

            color: #555;
        }


        .summary-total {

            display: flex;

            justify-content: space-between;

            border-top:
                1px solid #eeeeee;

            padding-top: 20px;

            margin-top: 20px;

            font-size: 20px;

            font-weight: 700;
        }


        .checkout-button {

            display: block;

            width: 100%;

            border: none;

            background: #111;

            color: white;

            padding: 14px;

            border-radius: 5px;

            margin-top: 25px;

            cursor: pointer;

            font-size: 15px;

            font-weight: 600;

            text-align: center;

        }


        .checkout-button:hover {

            opacity: 0.85;
        }


        /* =========================
           EMPTY CART
        ========================= */

        .empty-cart {

            text-align: center;

            background: #ffffff;

            border: 1px solid #eeeeee;

            border-radius: 10px;

            padding: 80px 20px;
        }


        .empty-cart h2 {

            margin-bottom: 12px;
        }


        .empty-cart p {

            color: #666;

            margin-bottom: 25px;
        }


        .continue-shopping {

            display: inline-block;

            background: #111;

            color: white;

            padding: 12px 22px;

            border-radius: 5px;

        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 850px) {

            .cart-layout {

                grid-template-columns: 1fr;

            }

            .cart-summary {

                position: static;

            }

        }


        @media (max-width: 600px) {

            .cart-item {

                grid-template-columns:
                    80px 1fr;

            }

            .cart-item-image {

                width: 80px;

                height: 80px;

            }

            .cart-item-total {

                grid-column: 2;

            }

        }
    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================= -->

    <!-- =========================
     HEADER
========================= -->

    <header class="header">

        <div class="container navbar">

            <div class="logo">
                ShopEasy
            </div>

            <nav class="nav-links">

                <a href="index.html">
                    Home
                </a>

                <a href="index.html#products">
                    Products
                </a>

                <a href="my-orders.html">
                    My Orders
                </a>

                <a href="cart.html">
                    Cart
                </a>

            </nav>

            <div class="cart-icon">

                🛒

                <span id="cart-count">
                    0
                </span>

            </div>

        </div>

    </header>



    <!-- =========================
         CART SECTION
    ========================= -->

    <main class="cart-section">

        <div class="container">

            <div class="cart-title">

                <h1>
                    Shopping Cart
                </h1>

                <p>
                    Review your products before checkout.
                </p>

            </div>


            <div id="cart-content">

                <div class="loading">
                    Loading cart...
                </div>

            </div>

        </div>

    </main>



    <!-- =========================
         FOOTER
    ========================= -->

    <footer class="footer">

        <div class="container">

            <h3>
                ShopEasy
            </h3>

            <p>
                Your simple online shopping destination.
            </p>

            <p class="copyright">
                © 2026 ShopEasy. All rights reserved.
            </p>

        </div>

    </footer>



    <!-- CART JAVASCRIPT -->

    <script src="js/cart.js"></script>

    <script>
        function goToCheckout() {

            const userData =
                localStorage.getItem(
                    "currentUser"
                );


            if (!userData) {

                alert(
                    "Please login before checkout."
                );

                window.location.href =
                    "login.html";

                return;
            }


            let user;

            try {

                user =
                    JSON.parse(
                        userData
                    );

            } catch (error) {

                alert(
                    "Please login again."
                );

                window.location.href =
                    "login.html";

                return;
            }


            if (
                !user ||
                !user.id
            ) {

                alert(
                    "Please login before checkout."
                );

                window.location.href =
                    "login.html";

                return;
            }


            const cartKey =
                `shoppingCart_user_${user.id}`;


            const cart =
                JSON.parse(
                    localStorage.getItem(
                        cartKey
                    )
                ) || [];


            if (
                cart.length === 0
            ) {

                alert(
                    "Your cart is empty."
                );

                return;
            }


            const token =
                localStorage.getItem(
                    "authToken"
                );


            if (!token) {

                alert(
                    "Please login before checkout."
                );

                window.location.href =
                    "login.html";

                return;
            }


            window.location.href =
                "checkout.html";
        }
    </script>

</body>

</html>
