<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Wishlist - ShopEasy</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        /* =========================
           WISHLIST PAGE
        ========================= */

        .wishlist-section {

            min-height: 70vh;

            padding: 70px 20px;

        }


        .wishlist-title {

            text-align: center;

            margin-bottom: 40px;

        }


        .wishlist-title h1 {

            font-size: 40px;

            margin-bottom: 10px;

        }


        .wishlist-title p {

            color: #666;

        }


        .wishlist-grid {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 25px;

            max-width: 1100px;

            margin: auto;

        }


        .wishlist-card {

            background: white;

            border: 1px solid #eeeeee;

            border-radius: 12px;

            overflow: hidden;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.08);

        }


        .wishlist-image {

            width: 100%;

            height: 220px;

            object-fit: cover;

        }


        .wishlist-info {

            padding: 20px;

        }


        .wishlist-category {

            font-size: 13px;

            color: #777;

            margin-bottom: 8px;

        }


        .wishlist-info h3 {

            margin-bottom: 10px;

        }


        .wishlist-price {

            font-size: 20px;

            font-weight: bold;

            margin-bottom: 15px;

        }


        .wishlist-actions {

            display: flex;

            gap: 10px;

            flex-wrap: wrap;

        }


        .wishlist-cart-button {

            flex: 1;

            border: none;

            background: #111;

            color: white;

            padding: 11px;

            border-radius: 6px;

            cursor: pointer;

            font-weight: 600;

        }


        .wishlist-remove-button {

            border: none;

            background: #dc3545;

            color: white;

            padding: 11px 15px;

            border-radius: 6px;

            cursor: pointer;

            font-weight: 600;

        }


        .wishlist-cart-button:hover,
        .wishlist-remove-button:hover {

            opacity: 0.85;

        }


        .empty-wishlist {

            text-align: center;

            max-width: 600px;

            margin: 50px auto;

            padding: 50px 20px;

            background: white;

            border-radius: 12px;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.08);

        }


        .empty-wishlist h2 {

            margin-bottom: 15px;

        }


        .empty-wishlist p {

            color: #666;

            margin-bottom: 25px;

        }


        .continue-shopping-button {

            display: inline-block;

            padding: 12px 22px;

            background: #007bff;

            color: white;

            text-decoration: none;

            border-radius: 7px;

            font-weight: 600;

        }


        @media (max-width: 900px) {

            .wishlist-grid {

                grid-template-columns:
                    repeat(2, 1fr);

            }

        }


        @media (max-width: 600px) {

            .wishlist-grid {

                grid-template-columns: 1fr;

            }

            .wishlist-title h1 {

                font-size: 32px;

            }

        }
    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================= -->

    <header class="header">

        <div class="container navbar">

            <div class="logo">
                ShopEasy
            </div>


            <nav class="nav-links">

                <a href="index.html">
                    Home
                </a>

                <a href="index.html#products">
                    Products
                </a>

                <a href="my-orders.html">
                    My Orders
                </a>

                <a href="wishlist.html">
                    Wishlist ❤️
                </a>

                <a href="cart.html">
                    Cart
                </a>

            </nav>


            <a href="cart.html" class="cart-icon">

                🛒

                <span id="cart-count">
                    0
                </span>

            </a>

        </div>

    </header>



    <!-- =========================
         WISHLIST SECTION
    ========================= -->

    <main class="wishlist-section">

        <div class="wishlist-title">

            <h1>
                My Wishlist ❤️
            </h1>

            <p>
                Save your favorite products and shop them later.
            </p>

        </div>


        <div id="wishlist-container" class="wishlist-grid">

            <p>
                Loading wishlist...
            </p>

        </div>

    </main>



    <!-- =========================
         FOOTER
    ========================= -->

    <footer class="footer">

        <div class="container">

            <h3>
                ShopEasy
            </h3>

            <p>
                Your simple online shopping destination.
            </p>

            <p class="copyright">
                © 2026 ShopEasy. All rights reserved.
            </p>

        </div>

    </footer>



    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script src="js/wishlist.js"></script>

</body>

</html>
